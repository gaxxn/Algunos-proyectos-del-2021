name: Build and Deploy Raylib Web

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Setup Raylib Web
        run: |
          git clone --depth 1 --branch 5.0 https://github.com/raysan5/raylib.git
          cd raylib/src
          make PLATFORM=PLATFORM_WEB
          mkdir -p /tmp/raylib
          cp libraylib.a /tmp/raylib/ 2>/dev/null || cp libraylib.web.a /tmp/raylib/libraylib.a
          cp raylib.h raymath.h rlgl.h /tmp/raylib/

      - name: Compile C++ to WebAssembly
        run: |
          emcc main.cpp -o index.html -Os -Wall -I/tmp/raylib -L/tmp/raylib -lraylib -s USE_GLFW=3 -s ASYNCIFY -DPLATFORM_WEB

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          
